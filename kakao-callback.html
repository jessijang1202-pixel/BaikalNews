<!DOCTYPE html>
<html lang="ko">
<head>
  <script>if (location.hostname === 'editor815.baikalnews.com') { location.replace('/admin/'); }</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <title>카카오 3분 뉴스 신청 - 바이칼 뉴스</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      background: linear-gradient(180deg, var(--bg-primary), var(--bg-secondary));
    }
    .kakao-callback-card {
      max-width: 440px;
      width: 100%;
      background: var(--bg-primary);
      border: 1px solid var(--border-light);
      border-radius: 20px;
      padding: 44px 36px 36px;
      box-shadow: 0 24px 60px oklch(30% 0.02 230 / 0.1);
    }
    .kakao-callback-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 28px;
    }
    .kakao-callback-logo img {
      height: 42px;
      width: auto;
      display: block;
    }
    .kakao-callback-logo span {
      font-family: var(--font-logo);
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-primary);
    }
    .kakao-callback-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .kakao-callback-icon.is-success {
      background: oklch(85% 0.08 150 / 0.35);
    }
    .kakao-callback-icon.is-error {
      background: oklch(85% 0.08 30 / 0.35);
    }
    .kakao-callback-icon svg {
      width: 30px;
      height: 30px;
    }
    .kakao-callback-card h1 {
      font-family: var(--font-serif);
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--text-primary);
    }
    .kakao-callback-card p#kakao-callback-message {
      color: var(--text-secondary);
      line-height: 1.7;
      font-size: 0.95rem;
      margin-bottom: 28px;
    }
    .kakao-callback-home-btn {
      display: inline-block;
      background-color: var(--accent-cyan);
      color: #ffffff;
      font-weight: 600;
      font-size: 0.9rem;
      padding: 13px 28px;
      border-radius: 8px;
      transition: var(--transition-smooth);
    }
    .kakao-callback-home-btn:hover {
      background-color: var(--accent-blue-hover);
    }
  </style>
</head>
<body>
  <div class="kakao-callback-card" id="kakao-callback-card">
    <div class="kakao-callback-logo">
      <img src="images/logo-mark-new.png" alt="바이칼뉴스">
      <span>바이칼뉴스</span>
    </div>
    <div class="kakao-callback-icon" id="kakao-callback-icon"></div>
    <h1 id="kakao-callback-title">확인 중입니다...</h1>
    <p id="kakao-callback-message"></p>
    <a class="kakao-callback-home-btn" href="index.html">바이칼 뉴스 홈으로 돌아가기</a>
  </div>
  <script>
    // api/kakao-oauth-callback.js가 실제 처리(토큰 교환, 전화번호 저장)를
    // 마친 뒤 이 페이지로 ?status=success 또는 ?status=error&reason=...
    // 형태로 리다이렉트한다. 이 페이지 자체는 그 결과를 사람이 읽을 수
    // 있는 메시지로만 보여준다.
    const params = new URLSearchParams(location.search);
    const status = params.get('status');
    const reason = params.get('reason');
    const subscriberName = params.get('name');
    const alreadySubscribed = params.get('already') === '1';
    const titleEl = document.getElementById('kakao-callback-title');
    const messageEl = document.getElementById('kakao-callback-message');
    const iconEl = document.getElementById('kakao-callback-icon');

    const reasonMessages = {
      no_code: '카카오 인증 정보를 받지 못했습니다.',
      token_exchange_failed: '카카오 인증 처리 중 오류가 발생했습니다.',
      no_phone_number: '전화번호 제공에 동의하지 않으셨거나, 카카오 계정에 등록된 번호를 확인하지 못했습니다.',
      save_failed: '신청 내용을 저장하는 중 오류가 발생했습니다.',
      server_error: '일시적인 서버 오류가 발생했습니다.'
    };

    const successIcon = '<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="11" stroke="oklch(55% 0.13 150)" stroke-width="1.6"/><path d="M7.5 12.5l3 3 6-6.5" stroke="oklch(45% 0.14 150)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    const errorIcon = '<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="11" stroke="oklch(58% 0.16 30)" stroke-width="1.6"/><path d="M8.5 8.5l7 7M15.5 8.5l-7 7" stroke="oklch(50% 0.17 30)" stroke-width="2" stroke-linecap="round"/></svg>';

    if (status === 'success') {
      iconEl.classList.add('is-success');
      iconEl.innerHTML = successIcon;
      // 헤더의 "구독하기" 링크가 다음 방문부터 "{이름}님 감사합니다"로
      // 바뀌도록 저장 (js/main.js의 applyKakaoSubscriberHeaderState()가 읽음).
      if (subscriberName) {
        localStorage.setItem('baikal_kakao_subscriber_name', subscriberName);
      }
      if (alreadySubscribed) {
        titleEl.textContent = '이미 신청하셨습니다';
        messageEl.textContent = '이미 카카오 3분 뉴스 브리핑을 신청하셨습니다. 매일 아침 카카오톡 채널로 계속 보내드리고 있습니다.';
      } else {
        titleEl.textContent = '3분 뉴스 신청이 완료되었습니다';
        messageEl.textContent = '카카오톡 채널을 통해 매일 아침 3분 뉴스 브리핑을 보내드리겠습니다.';
      }
    } else {
      iconEl.classList.add('is-error');
      iconEl.innerHTML = errorIcon;
      titleEl.textContent = '신청을 완료하지 못했습니다';
      messageEl.textContent = reasonMessages[reason] || '알 수 없는 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.';
    }
  </script>
</body>
</html>
