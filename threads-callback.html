<!DOCTYPE html>
<html lang="ko">
<head>
  <script>if (location.hostname === 'editor815.baikalnews.com') { location.replace('/admin/'); }</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <title>스레드 연동 - 바이칼 뉴스 관리자</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .threads-callback-card {
      max-width: 460px;
      background: var(--bg-secondary, #f7f7f5);
      border-radius: 16px;
      padding: 40px 32px;
    }
    .threads-callback-card h1 {
      font-family: var(--font-serif);
      font-size: 1.4rem;
      margin-bottom: 12px;
    }
    .threads-callback-card p {
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 8px;
    }
    .threads-callback-card a {
      color: var(--accent-cyan);
    }
  </style>
</head>
<body>
  <div class="threads-callback-card" id="threads-callback-card">
    <h1 id="threads-callback-title">확인 중입니다...</h1>
    <p id="threads-callback-message"></p>
    <p><a href="/admin/#sns">관리자 SNS 관리로 돌아가기</a></p>
  </div>
  <script>
    // api/threads-oauth-callback.js가 실제 처리(토큰 교환, 저장)를 마친 뒤
    // 이 페이지로 ?status=success 또는 ?status=error&reason=... 형태로
    // 리다이렉트한다. 이 페이지는 그 결과만 사람이 읽을 수 있게 보여준다.
    const params = new URLSearchParams(location.search);
    const status = params.get('status');
    const reason = params.get('reason');
    const titleEl = document.getElementById('threads-callback-title');
    const messageEl = document.getElementById('threads-callback-message');

    const reasonMessages = {
      no_code: '스레드 인증 정보를 받지 못했습니다.',
      token_exchange_failed: '스레드 인증 처리 중 오류가 발생했습니다.',
      profile_fetch_failed: '스레드 계정 정보를 확인하지 못했습니다.',
      save_failed: '연동 정보를 저장하는 중 오류가 발생했습니다.',
      server_error: '서버 설정(환경변수)이 완료되지 않았습니다.'
    };

    if (status === 'success') {
      titleEl.textContent = '스레드 계정이 연동되었습니다';
      messageEl.textContent = '이제 SNS 관리 화면에서 스레드로 바로 발행할 수 있습니다.';
    } else {
      titleEl.textContent = '연동을 완료하지 못했습니다';
      messageEl.textContent = reasonMessages[reason] || '알 수 없는 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.';
    }
  </script>
</body>
</html>
